[project]
name = "aegis-orchestration-engine"
version = "0.1.0"
description = "A model-agnostic, local-first AI orchestration engine."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
aegis = "aegis_engine.cli:main"

[project.optional-dependencies]
laya = ["laya>=0.3.6,<0.4"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aegis_engine"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]
