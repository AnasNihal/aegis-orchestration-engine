name: Git identity guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit identities
        run: |
          python3 scripts/check_git_identity.py --range "${{ github.event.before || 'HEAD~1' }}..${{ github.sha }}"
